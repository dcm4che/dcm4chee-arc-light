<div class="vex vex-theme-os edit-series" xmlns="http://www.w3.org/1999/html">
    <div class="vex-dialog-form" (keyup)="change()">
        <h3 [innerHtml]="titleLabel"></h3>
        @if (opendropdown) {
<div class="overlay" (click)="opendropdown = false"></div>
}
        <input autocomplete="off" id="addSeriesAttribut" class="addSeriesAttribut" [(ngModel)]="addSeriesAttribut" i18n-placeholder="@@placeholder.add_new_attribute" placeholder="Add new attribute"  (click)="opendropdown = !opendropdown"  (keydown)="pressedKey($event)"/>
        @if (opendropdown) {
<div class="dropdown study_edit">
            @for (m of dropdown | search:addSeriesAttribut; track m) {
<a class="dropdown_element" name="{{m.code}}" (click)="$event.preventDefault();addAttribute(m.code)">({{m.codeComma}}) {{m.name}}</a>
}
        </div>
}
        <div mat-dialog-content>
            @if (_seriesResult.series && _seriesResult.series['attrs']) {
<iod-form-generator [object]="_seriesResult.series['attrs']" [prefix]="" [mode]="mode" (validityChange)="iodFormValid = $event"   (keydown)="dialogKeyHandler($event,dialogRef)"></iod-form-generator>
}
        </div>
        <div class="inputpart">
            @if (_seriesResult.editMode != 'single') {
<div class="form_input">
                <label i18n="@@update_policy_label">Update Policy :</label>
                <dcm-drop-down [options]="updatePolicy" [(model)]="_seriesResult.updatePolicyResult"
                               [editable]="false" [showSearchField]="false" [multiSelectMode]="false" [showStar]="false"
                               (modelChange)="_seriesResult.updatePolicyResult = $event">
                </dcm-drop-down>
            </div>
}
            <div class="form_input">
                <label i18n="@@reason_for_modification_label">Reason for modification:</label>
                <dcm-drop-down [options]="reasonForModification" [(model)]="_seriesResult.reasonForModificationResult"
                               [editable]="false" [showSearchField]="false" [multiSelectMode]="false" [showStar]="false"
                               (modelChange)="_seriesResult.reasonForModificationResult = $event">
                </dcm-drop-down>
            </div>
            <div class="form_input">
                <label i18n="@@source_of_prev_vals_label">Source of previous values:</label>
                <input type="text" [(ngModel)]="_seriesResult.sourceOfPrevVals" i18n-placeholder="source_of_previous_values" placeholder="Source of previous values">
            </div>
        </div>
        <div class="dialogbuttons">
            <button class="save" type="button" [disabled]="!isFormValid" (click)="onSaveClick(seriesResult)">{{saveLabel}}</button>
            <button class="cancle" type="button" (click)="dialogRef.close(null)" i18n="@@CANCEL">CANCEL</button>
        </div>
    </div>
</div>
