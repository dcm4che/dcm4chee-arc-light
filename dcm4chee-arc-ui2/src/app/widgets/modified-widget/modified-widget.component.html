<div class="modified_widget">
    <div class="main_input_block" title="{{title}}">
        <!--        <input class="main_input" [ngClass]="{'ng-invalid':(!maiInputValid)}" type="text" [(ngModel)]="model" placeholder="{{placeholder}}"  (ngModelChange)="filterChanged()" (click)="selectorOpen = true">-->
        <label class="main_input" [ngClass]="{'black':stateText}" (click)="toggleSelector()"
               title="{{stateTextHover || placeholder}}">
            {{ stateText || placeholder }}
        </label>
        @if (model) {
            <span class="glyphicon glyphicon-remove clear_picker" (click)="hardClear()"></span>
        }
        <!--        <i class="material-icons filter_button" (click)="toggleSelector()">
                    subdirectory_arrow_right
                </i>-->
        <i class="glyphicon glyphicon-pencil filter_button" (click)="toggleSelector()">
        </i>
        @if (selectorOpen) {

            <div class="overlay" (click)="selectorOpen = false">
            </div>
            <div class="content_block">
                @if (title) {
                    <h5 class="title">{{ title }}</h5>
                }
                <div class="filter">
                    <div class="line">
                        <label>All modified:</label>
                        <input type="checkbox" [(ngModel)]="allModified" (change)="changeAllModified($event)"><br/>
                    </div>
                    <div class="line">
                        <label>Modified DICOM attributes:</label>
                        @if (iod) {
                            <div>
                                <div class="add_block" [ngClass]="{'empty':modifiedAttr.size === 0}">
                                    <dcm-drop-down
                                            [options]="iod"
                                            [(model)]="newAttribute"
                                            [showSearchField]="true"
                                            [multiSelectMode]="false"
                                            [placeholder]="placeholder"
                                            (modelChange)="onDropdownChange($event)"
                                    ></dcm-drop-down>
                                    <!--
                                                                    <i title="Add" class="material-icons" (click)="addAttribute(newAttribute)">add</i>
                                    -->
                                </div>
                                <ul class="modified_list"
                                    [ngClass]="{'not-empty':modifiedAttr && modifiedAttr.size && modifiedAttr.size > 0}">
                                    @for (attr of Array.from(modifiedAttr.values()); track attr) {
                                        <li>
                                            <label title="{{attr}}">{{ getLabelFromIODTag(attr) }}</label><i
                                                title="Delete" (click)="remove(attr)" class="material-icons">clear</i>
                                        </li>
                                    }
                                </ul>
                            </div>
                        }

                    </div>
                    <!--                    <ng-container *ngIf="!allModified && iod">
                                            <div class="line">
                                                <label>Modified DICOM attributes:</label>
                                                <dcm-drop-down
                                                        [options]="iod"
                                                        [(model)]="modifiedAttr"
                                                        [showSearchField]="true"
                                                        [multiSelectMode]="true"
                                                        (modelChange)="modifiedAttrChanged($event)"
                                                ></dcm-drop-down>
                                            </div>
                                        </ng-container>-->
                </div>
                <div class="dialogbuttons">
                    <button class="set_button save" [disabled]="!(modifiedAttr && modifiedAttr.size > 0)"
                            (click)="setFilter()" i18n="@@Set">Set
                    </button>
                    <button class="cancle" type="button" (click)="clear()" i18n="@@Clear">Clear</button>
                </div>
            </div>

        }
    </div>
</div>
